<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Job - JobTrack</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .page-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 30px;
            color: #111827;
        }

        .page-header p {
            margin-top: 8px;
            color: #6b7280;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .button-section {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .form-card {
                padding: 20px;
            }

            .button-section {
                flex-direction: column;
            }

            .btn {
                text-align: center;
            }
        }

    </style>

</head>

<body>

    {% include "navbar.html" %}

    <div class="page-container">

        <div class="page-header">

            <h1>Add New Job</h1>

            <p>
                Add a new job application to your JobTrack account.
            </p>

        </div>

        <div class="form-card">

            <form method="POST" action="{{ url_for('add_job') }}">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="company">
                            Company
                        </label>

                        <input
                            type="text"
                            id="company"
                            name="company"
                            placeholder="Enter company name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="role">
                            Job Role
                        </label>

                        <input
                            type="text"
                            id="role"
                            name="role"
                            placeholder="Enter job role"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="location">
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            name="location"
                            placeholder="Enter job location"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="status">
                            Application Status
                        </label>

                        <select
                            id="status"
                            name="status"
                            required
                        >

                            <option value="">
                                Select Status
                            </option>

                            <option value="Applied">
                                Applied
                            </option>

                            <option value="Interview">
                                Interview
                            </option>

                            <option value="Selected">
                                Selected
                            </option>

                            <option value="Rejected">
                                Rejected
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="salary">
                            Salary
                        </label>

                        <input
                            type="text"
                            id="salary"
                            name="salary"
                            placeholder="Example: 6 LPA"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="date_applied">
                            Date Applied
                        </label>

                        <input
                            type="date"
                            id="date_applied"
                            name="date_applied"
                            required
                        >

                    </div>

                </div>


                <div class="button-section">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Job
                    </button>

                    <a
                        href="{{ url_for('view_jobs') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
