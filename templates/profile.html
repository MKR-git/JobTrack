<!DOCTYPE html>
<html>

<head>

    <title>My Profile - JobTrack</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .username {
            color: #555;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .stat-card h3 {
            margin: 0;
            font-size: 16px;
        }

        .stat-card p {
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0 0;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            margin-right: 10px;
            text-decoration: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
        }

        .button:hover {
            opacity: 0.85;
        }

    </style>

</head>

<body>

    {% include "navbar.html" %}

    <div class="container">

        <div class="profile-card">

            <h1>My Profile</h1>

            <p class="username">
                <strong>Username:</strong> {{ username }}
            </p>

            <hr>

            <h2>My Application Statistics</h2>

            <div class="stats">

                <div class="stat-card">
                    <h3>Total Jobs</h3>
                    <p>{{ total_jobs }}</p>
                </div>

                <div class="stat-card">
                    <h3>Applied</h3>
                    <p>{{ applied_jobs }}</p>
                </div>

                <div class="stat-card">
                    <h3>Interview</h3>
                    <p>{{ interview_jobs }}</p>
                </div>

                <div class="stat-card">
                    <h3>Selected</h3>
                    <p>{{ selected_jobs }}</p>
                </div>

                <div class="stat-card">
                    <h3>Rejected</h3>
                    <p>{{ rejected_jobs }}</p>
                </div>

            </div>

            <div class="buttons">

                <a href="/change-password" class="button">
                    Change Password
                </a>

                <a href="/" class="button">
                    Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</body>

</html>
