<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Job - JobTrack</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }


        /* Navbar */

        .navbar {
            background: #1f2937;
            color: white;
            padding: 16px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 22px;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }


        /* Main container */

        .container {
            max-width: 750px;
            margin: 45px auto;
            padding: 0 20px;
        }


        /* Header */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-header p {
            margin-top: 8px;
            color: #6b7280;
        }


        /* Form card */

        .form-card {
            background: white;
            padding: 30px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }


        /* Form */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;

            color: #374151;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.1);
        }


        /* Two-column layout */

        .form-row {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        /* Buttons */

        .actions {
            display: flex;

            gap: 12px;

            margin-top: 28px;

            padding-top: 25px;

            border-top: 1px solid #e5e7eb;
        }

        .button {
            padding: 11px 20px;

            border: none;

            border-radius: 7px;

            text-decoration: none;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            display: inline-block;
        }

        .save-button {
            background: #2563eb;
            color: white;
        }

        .save-button:hover {
            background: #1d4ed8;
        }

        .cancel-button {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel-button:hover {
            background: #d1d5db;
        }


        /* Mobile */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;

                flex-direction: column;

                gap: 12px;
            }

            .navbar a {
                margin-left: 10px;
                margin-right: 10px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                text-align: center;
            }

        }

    </style>

</head>


<body>


<!-- Navbar -->

<div class="navbar">

    <h2>JobTrack</h2>

    <div>

        <a href="{{ url_for('home') }}">
            Dashboard
        </a>

        <a href="{{ url_for('add_job') }}">
            Add Job
        </a>

        <a href="{{ url_for('view_jobs') }}">
            View Jobs
        </a>

        <a href="{{ url_for('status_summary') }}">
            Status Summary
        </a>

    </div>

</div>


<!-- Main container -->

<div class="container">


    <!-- Header -->

    <div class="page-header">

        <h1>Edit Job</h1>

        <p>
            Update the details of your job application.
        </p>

    </div>


    <!-- Form -->

    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for('edit_job', job_id=job['id']) }}"
        >


            <!-- Company -->

            <div class="form-group">

                <label for="company">
                    Company
                </label>

                <input
                    type="text"
                    id="company"
                    name="company"
                    value="{{ job['company'] }}"
                    required
                >

            </div>


            <!-- Role -->

            <div class="form-group">

                <label for="role">
                    Job Role
                </label>

                <input
                    type="text"
                    id="role"
                    name="role"
                    value="{{ job['role'] }}"
                    required
                >

            </div>


            <!-- Location -->

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ job['location'] }}"
                    required
                >

            </div>


            <!-- Status + Salary -->

            <div class="form-row">


                <div class="form-group">

                    <label for="status">
                        Application Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        required
                    >

                        <option
                            value="Applied"
                            {% if job['status'] == 'Applied' %}
                                selected
                            {% endif %}
                        >
                            Applied
                        </option>

                        <option
                            value="Interview"
                            {% if job['status'] == 'Interview' %}
                                selected
                            {% endif %}
                        >
                            Interview
                        </option>

                        <option
                            value="Selected"
                            {% if job['status'] == 'Selected' %}
                                selected
                            {% endif %}
                        >
                            Selected
                        </option>

                        <option
                            value="Rejected"
                            {% if job['status'] == 'Rejected' %}
                                selected
                            {% endif %}
                        >
                            Rejected
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="salary">
                        Salary
                    </label>

                    <input
                        type="text"
                        id="salary"
                        name="salary"
                        value="{{ job['salary'] }}"
                        placeholder="Example: 6 LPA"
                    >

                </div>

            </div>


            <!-- Date -->

            <div class="form-group">

                <label for="date_applied">
                    Date Applied
                </label>

                <input
                    type="date"
                    id="date_applied"
                    name="date_applied"
                    value="{{ job['date_applied'] }}"
                    required
                >

            </div>


            <!-- Buttons -->

            <div class="actions">

                <button
                    type="submit"
                    class="button save-button"
                >
                    Save Changes
                </button>


                <a
                    href="{{ url_for('view_jobs') }}"
                    class="button cancel-button"
                >
                    Cancel
                </a>

            </div>


        </form>

    </div>


</div>


</body>

</html>
