<!DOCTYPE html>
<html>

<head>

    <title>Change Password - JobTrack</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 450px;
            margin: 50px auto;
        }

        .password-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
        }

    </style>

</head>

<body>

    {% include "navbar.html" %}

    <div class="container">

        <div class="password-card">

            <h1>Change Password</h1>

            <form method="POST">

                <label>
                    Current Password
                </label>

                <input
                    type="password"
                    name="current_password"
                    required
                >

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    name="new_password"
                    required
                >

                <label>
                    Confirm New Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                >

                <button type="submit">
                    Change Password
                </button>

            </form>

            <a href="/profile" class="back-link">
                Back to Profile
            </a>

        </div>

    </div>

</body>

</html>
