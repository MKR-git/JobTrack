<!DOCTYPE html>
<html>

<head>

    <title>Register - JobTrack</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
        }

        .container {
            width: 400px;
            margin: 80px auto;
        }

        .register-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 11px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="register-card">

            <h1>JobTrack</h1>

            <p class="subtitle">
                Create your account
            </p>

            <form method="POST">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <div class="login-link">

                <p>
                    Already have an account?
                    <a href="/login">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
